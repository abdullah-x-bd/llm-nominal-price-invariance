name: OpenRouter inference

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'pilot or full'
        required: true
        default: 'pilot'
        type: choice
        options:
          - pilot
          - full
      concurrency:
        description: 'Concurrent API requests'
        required: true
        default: '16'
        type: string
  push:
    paths:
      - '.github/full-trigger'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/generate_design.py
      - run: pytest -q
      - name: Run inference
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          MODE="${DISPATCH_MODE:-full}"
          CONCURRENCY="${DISPATCH_CONCURRENCY:-8}"
          python -m nominal_price_invariance.collect \
            --mode "$MODE" \
            --concurrency "$CONCURRENCY" \
            --out data/results/results.csv
      - name: Audit collection
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          manifest = Path("data/results/results.manifest.json")
          failures = Path("data/results/results.failures.jsonl")
          results = Path("data/results/results.csv")

          if manifest.exists():
              print("MANIFEST")
              print(manifest.read_text())

          if failures.exists():
              lines = [x for x in failures.read_text().splitlines() if x.strip()]
              print("FAILURE_COUNT", len(lines))
              if lines:
                  records = [json.loads(x) for x in lines]
                  counts = {}
                  for r in records:
                      counts[r["model"]] = counts.get(r["model"], 0) + 1
                  print("FAILURES_BY_MODEL", json.dumps(counts, sort_keys=True))
                  for r in records[:5]:
                      print("FAILURE_SAMPLE", r["model"], r["condition_id"], r["error"][:1000])

          if results.exists():
              df = pd.read_csv(results)
              print("RESULT_ROWS", len(df))
              print("ROWS_BY_MODEL")
              print(df.groupby("model").size().to_string())
              print("COST_BY_MODEL")
              print(df.groupby("model")["cost_usd"].sum().to_string())
              print("TOKENS_BY_MODEL")
              print(df.groupby("model")[["prompt_tokens", "completion_tokens"]].sum().to_string())
              if "provider" in df:
                  print("PROVIDER_COUNTS")
                  print(df.groupby(["model", "provider"], dropna=False).size().to_string())
              print("ATTEMPT_COUNTS")
              print(df.groupby(["model", "attempt_count"]).size().to_string())
          PY
      - name: Analyze completed observations
        if: always()
        run: |
          if [ -f data/results/results.csv ]; then
            python -m nominal_price_invariance.analysis data/results/results.csv --outdir results/analysis
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nominal-price-${{ inputs.mode || 'full' }}-${{ github.run_id }}
          path: |
            data/results/
            results/analysis/
          if-no-files-found: warn
